services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medishelf-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=staging
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8080,http://127.0.0.1:8080,http://127.0.0.1:3000
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: medishelf-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - PORT=8080
      - HOST=0.0.0.0
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
